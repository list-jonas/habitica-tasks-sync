services:
  habitica-tasks-sync:
    build: .
    image: habitica-tasks-sync:latest
    container_name: habitica-tasks-sync
    restart: unless-stopped
    environment:
      - HABITICA_SYNC_CONFIG=/etc/habitica-tasks-sync/config.yaml
      - TZ=${TZ:-UTC}
    volumes:
      # Sync state DB.
      - ./data:/data
      # OAuth client secret + per-user token files (mint with the auth helper on the host first).
      - ./tokens:/tokens:ro
      # Sync configuration.
      - ./config.yaml:/etc/habitica-tasks-sync/config.yaml:ro
    # Container is stateless apart from the volumes above. Logs go to stdout.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
